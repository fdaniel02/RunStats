name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - run: dotnet restore --locked-mode

      - run: dotnet tool restore

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: gateway
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /o:fdaniel02
          /k:fdaniel02_RunStats
          /d:sonar.host.url=https://sonarcloud.io
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths=TestResults/coverage.opencover.*.xml
          /d:sonar.exclusions=**/Migrations/**,**/wwwroot/lib/**
          /d:sonar.coverage.exclusions=**/Migrations/**,**/ReconnectModal.razor.js,gateway/tests/**,tests/js/**
          /d:sonar.javascript.lcov.reportPaths=${{ github.workspace }}/TestResults/js-lcov.info
          /d:sonar.python.version=3.14
          /d:sonar.python.coverage.reportPaths=gateway/coverage.xml

      - run: dotnet build -c Release --no-restore

      - run: dotnet test -c Release --no-build --coverlet

      - working-directory: gateway
        run: uv sync --frozen --no-build

      - working-directory: gateway
        run: uv run --frozen --no-build ruff check

      - working-directory: gateway
        run: uv run --frozen --no-build ruff format --check

      - working-directory: gateway
        run: uv run --frozen --no-build pytest --cov --cov-report=xml

      - run: |
          node --test --experimental-test-coverage --test-coverage-include="src/**/*.js"             --test-reporter=spec --test-reporter-destination=stdout             --test-reporter=lcov --test-reporter-destination=TestResults/js-lcov.info             "tests/js/*.test.mjs"
          sed -i "s|^SF:|SF:$GITHUB_WORKSPACE/|" TestResults/js-lcov.info

      - if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            TestResults/coverage.opencover.*.xml
            gateway/coverage.xml
            TestResults/js-lcov.info
          retention-days: 7

  image:
    name: Docker image (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: runstats
            context: .
          - name: runstats-garmin-gateway
            context: gateway
    env:
      IMAGE: ghcr.io/fdaniel02/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  publish:
    name: Publish image (${{ matrix.name }})
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      matrix:
        name: [runstats, runstats-garmin-gateway]
    env:
      IMAGE: ghcr.io/fdaniel02/${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}

      - run: docker load --input "$RUNNER_TEMP/image.tar"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker push --all-tags "$IMAGE"

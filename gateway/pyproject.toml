[project]
name = "garmin-gateway"
version = "0.1.0"
description = "Passes Garmin Connect data on to RunStats"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "garminconnect>=0.3.20",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "python-json-logger>=4.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv]
# An application, not a package: nothing to build, so uv can run with --no-build.
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["garmin_gateway"]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[project]
name = "garmin-gateway"
version = "0.1.0"
description = "Passes Garmin Connect data on to RunStats"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "garminconnect>=0.3.20",
    "python-json-logger>=4.2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["garmin_gateway"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
